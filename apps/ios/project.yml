name: Ponder
options:
  bundleIdPrefix: org.edgeever
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: "16.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION live only in
    # Config/Version.xcconfig. Hardcoding them here makes xcodegen overwrite
    # the Release tag during ci_post_clone.
    # Automatic signing: required for Xcode Cloud (managed certs/profiles for
    # App Store + Development exports). Local ExportOptions.plist still pins
    # App Store profiles for Scripts/archive-app-store.sh export.
    DEVELOPMENT_TEAM: 9KA3NM38B6
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Ponder:
    type: application
    platform: iOS
    sources:
      - path: Ponder
        excludes:
          - Resources/Info.plist
          - Resources/EditorBundle/assets
      - path: Ponder/Resources/EditorBundle/assets
        type: folder
        buildPhase: resources
    resources:
      - path: Ponder/Resources/Assets.xcassets
      - path: Ponder/Resources/Localizable.xcstrings
      - path: Ponder/Resources/PrivacyInfo.xcprivacy
      - path: Ponder/Resources/EditorBundle
        excludes:
          - assets
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Pow
        product: Pow
      - target: ShareExtension
    embed:
      - path: ShareExtension.appex
        buildPhase: embedAppExtensions
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.appkeep.ponder.mobile
        PRODUCT_NAME: Ponder
        INFOPLIST_FILE: Ponder/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ponder/Resources/Ponder.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_TESTABILITY: true
        # Always Automatic: Xcode Cloud needs managed Development + Distribution
        # profiles. Local App Store export still uses ExportOptions.plist (manual
        # profiles) in Scripts/archive-app-store.sh.
        DEVELOPMENT_TEAM: 9KA3NM38B6
        CODE_SIGN_STYLE: Automatic
    info:
      path: Ponder/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ponder
        CFBundleName: Ponder
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - ja
          - pl
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: io.appkeep.ponder.mobile
            CFBundleURLSchemes:
              - ponder
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSPhotoLibraryUsageDescription: Ponder needs photo library access to insert images into notes.
        NSCameraUsageDescription: Ponder needs camera access to take photos and insert them into notes.
        NSMicrophoneUsageDescription: Ponder only uses the microphone if content inside a note explicitly requests it.
    entitlements:
      path: Ponder/Resources/Ponder.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.appkeep.ponder.mobile
    scheme:
      testTargets:
        - PonderTests
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
    settings:
      base:
        # Keep the existing App Store App ID used by the previous RN share extension.
        PRODUCT_BUNDLE_IDENTIFIER: io.appkeep.ponder.mobile.expo-sharing-extension
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        DEVELOPMENT_TEAM: 9KA3NM38B6
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.appkeep.ponder.mobile
  PonderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PonderTests
    dependencies:
      - target: Ponder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.appkeep.ponder.mobile.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ponder.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ponder"
        BUNDLE_LOADER: "$(TEST_HOST)"
