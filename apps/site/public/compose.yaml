services:
  ponder:
    image: "${PONDER_IMAGE:-ghcr.io/tianma-if/edgeever}:${PONDER_VERSION:-latest}"
    restart: unless-stopped
    init: true
    ports:
      - "${PONDER_PORT:-8787}:8787"
    environment:
      PONDER_AUTH_USERNAME: "${PONDER_AUTH_USERNAME:-admin}"
      PONDER_AUTH_PASSWORD: "${PONDER_AUTH_PASSWORD:?Set PONDER_AUTH_PASSWORD before starting Ponder}"
      PONDER_CONTAINER_IMAGE: "${PONDER_IMAGE:-ghcr.io/tianma-if/edgeever}"
    volumes:
      - ponder-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  ponder-data:
